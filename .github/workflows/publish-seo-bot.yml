name: Publish SEO Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seo-bot-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out SEO Bot source
        uses: actions/checkout@v4

      - name: Validate SEO bot source and checklists
        run: |
          set -euo pipefail
          node --check script.js
          node -e "JSON.parse(require('fs').readFileSync('on-page-checklist.json','utf8')); JSON.parse(require('fs').readFileSync('off-page-checklist.json','utf8')); const k=JSON.parse(require('fs').readFileSync('keywords/steemgames.json','utf8')); if(k.projectId!=='steem-games'||!Array.isArray(k.keywords)||!k.pages) process.exit(1); console.log('SEO source, checklists and keyword strategy are valid.')"

      - name: Prepare standalone Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/keywords _site/public-manifests
          cp index.html style.css script.js on-page-checklist.json off-page-checklist.json _site/
          cp keywords/steemgames.json _site/keywords/
          cp -R public-manifests/. _site/public-manifests/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy SEO Bot
        id: deployment
        uses: actions/deploy-pages@v4
