name: Deploy SEO Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SEO Bot source
        uses: actions/checkout@v4

      - name: Validate source and build deployment files
        run: |
          set -euo pipefail
          node --check script.js
          node - <<'NODE'
          const fs = require('fs');
          JSON.parse(fs.readFileSync('on-page-checklist.json', 'utf8'));
          JSON.parse(fs.readFileSync('off-page-checklist.json', 'utf8'));
          const keywords = JSON.parse(fs.readFileSync('keywords/steemgames.json', 'utf8'));
          if (keywords.projectId !== 'steem-games' || !Array.isArray(keywords.keywords) || !keywords.pages) {
            throw new Error('Steem Games keyword configuration is invalid.');
          }
          for (const file of fs.readdirSync('public-manifests').filter(name => name.endsWith('.json'))) {
            JSON.parse(fs.readFileSync('public-manifests/' + file, 'utf8'));
          }
          console.log('SEO Bot source and JSON assets validated.');
          NODE
          test -f worker.js
          test -f wrangler.toml
          rm -rf dist
          mkdir -p dist/keywords dist/public-manifests
          cp index.html style.css script.js on-page-checklist.json off-page-checklist.json dist/
          cp keywords/steemgames.json dist/keywords/
          cp public-manifests/*.json dist/public-manifests/
          echo 'Deployment bundle created:'
          find dist -type f -print | sort

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d334e3c238734436efc92cf3b63c311f
          command: deploy --config wrangler.toml

